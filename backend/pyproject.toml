[project]
name = "decops-backend"
version = "1.0.0"
description = "DecOps Operations Management System - Backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pwdlib[argon2]>=0.2.1",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.12",
    "weasyprint",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
    "sentry-sdk[fastapi]>=2.73.0",
    "httpx>=0.27.0",      # outgoing webhooks
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
